name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # A real PostgreSQL server, not the embedded development database. The
    # double-booking suite races transactions against the GiST exclusion
    # constraint, and a race needs genuine parallelism to prove anything.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
          POSTGRES_DB: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both point at the same server: there is no pooler in front of it, and
      # `prisma migrate` cannot run over a transaction pooler in any case.
      DATABASE_URL: postgresql://rental:rental@127.0.0.1:5432/rental
      DIRECT_URL: postgresql://rental:rental@127.0.0.1:5432/rental
      # Throwaway, and only ever used to sign sessions that never leave the job.
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The full suite: unit tests plus the integration suite. Neither
      # DATABASE_POOL_MAX nor DEV_DB_CONCURRENCY_LIMITED is set, so the two
      # racing tests run rather than skipping.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
